<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-slider">
        <img src="https://picsum.photos/id/1/900/500" alt="image" />
        <img src="https://picsum.photos/id/2/900/500" alt="image" />
        <img src="https://picsum.photos/id/5/900/500" alt="image" />
        <img src="https://picsum.photos/id/12/900/500" alt="image" />
        <img src="https://picsum.photos/id/18/900/500" alt="image" />
      </div>
      <i class="bx bx-chevrons-left prev icon"></i>
      <i class="bx bx-chevrons-right next icon"></i>
      <!-- Status Icons -->
      <div class="status-icons">
        <div class="status-icon active"></div>
        <div class="status-icon"></div>
        <div class="status-icon"></div>
        <div class="status-icon"></div>
        <div class="status-icon"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
